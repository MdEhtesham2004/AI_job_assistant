[project]
name = "ai-job-platform-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Job Application Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "tzdata>=2025.2",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.18",
    "croniter>=6.2.4",
    "cryptography>=50.0.2",
    "dnspython>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx2>=2.13.1",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "fakeredis>=2.26",
    "types-croniter>=6.2.4.20260711",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
