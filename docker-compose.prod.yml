# Production stack (Phase 14).
#
#   cp .env.prod.example .env.prod      # fill in the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Web app: http://<host>:${WEB_PORT}. HTTPS: add -f docker-compose.https.yml (DEPLOYMENT.md).
# Only `web` is published; the API, database, Redis and Gotenberg stay on the internal network.

name: ai-job-platform-prod

# One backend image, built once (by `api`) and reused by migrate / worker / beat.
x-backend: &backend
  image: ai-job-platform-backend:${APP_VERSION:-0.1.0}
  pull_policy: never
  env_file: .env.prod
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    GOTENBERG_URL: http://gotenberg:3000
    CELERY_ENABLED: "true"
    STORAGE_BACKEND: local
    STORAGE_LOCAL_PATH: /app/storage
    LOG_JSON: "true"
  volumes:
    - storage_data:/app/storage
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    image: ai-job-platform-web:${APP_VERSION:-0.1.0}
    build:
      context: ./frontend/ai_job_application_frontend
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: bring the database schema up to date, then exit (api waits for it).
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    build:
      context: ./backend
    pull_policy: build
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=${API_WORKERS:-2}
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command:
      ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default,ai,pdf,email",
       "--concurrency=${WORKER_CONCURRENCY:-2}", "-l", "info"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 10 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Exactly one scheduler: scheduled emails, reply polling, saved searches.
  beat:
    <<: *backend
    command:
      ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info",
       "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  # Daily database dump + files archive, kept BACKUP_KEEP_DAYS days (backend/scripts).
  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backend/scripts:/scripts:ro
      - storage_data:/storage:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
